version: '1.0'
biobank: XRZBXQ
cdm: 'demo/SDTM:2.1'
participantTable: omop_combined.person
participantIdField: person_id
cte:
  -
    name: conditions_cte
    sql: |
      SELECT DISTINCT ON (co.person_id, c.concept_code, co.condition_start_date)
        co.person_id,
        co.condition_start_date,
        co.condition_end_date,
        c.concept_name,
        c.concept_code,
        c.concept_id,
        c.domain_id
      FROM omop_combined.condition_occurrence co JOIN omop_combined.concept c ON co.condition_concept_id = c.concept_id
      ORDER BY co.person_id, c.concept_code, co.condition_start_date, co.condition_end_date NULLS LAST
    description: 'CTE for conditions from omop_combined.condition_occurrence'
  -
    name: ts_cte
    sql: |
      SELECT  1 AS tsseq, 'SDTMVER'  AS tsparmcd, 'SDTM Version'                            AS tsparm, '2.0'          AS tsval, NULL::text AS tsvalnf, NULL::text AS tsvalcd, NULL::text AS tsvcdref, NULL::text AS tsvcdver
      UNION ALL SELECT  2, 'SDTIGVER', 'SDTM IG Version',                        '3.4',                NULL, NULL, NULL, NULL
      UNION ALL SELECT  3, 'TITLE',    'Trial Title',                             'Biobank XRZBXQ Observational Study', NULL, NULL, NULL, NULL
      UNION ALL SELECT  4, 'SPONSOR',  'Clinical Study Sponsor',                  'XRZBXQ',             NULL, NULL, NULL, NULL
      UNION ALL SELECT  5, 'REGID',    'Registry Identifier',                     NULL,                 'NA', NULL, NULL, NULL
      UNION ALL SELECT  6, 'TTYPE',    'Trial Type',                              'OBSERVATIONAL',      NULL, NULL, NULL, NULL
      UNION ALL SELECT  7, 'STYPE',    'Study Type',                              'OBSERVATIONAL',      NULL, NULL, NULL, NULL
      UNION ALL SELECT  8, 'TPHASE',   'Trial Phase Classification',              NULL,                 'NA', NULL, NULL, NULL
      UNION ALL SELECT  9, 'TCNTRL',   'Control Type',                            'NONE',               NULL, NULL, NULL, NULL
      UNION ALL SELECT 10, 'TINDTP',   'Trial Intent Type',                       'BASIC SCIENCE',      NULL, NULL, NULL, NULL
      UNION ALL SELECT 11, 'THERAREA', 'Therapeutic Area',                        'GENERAL',            NULL, NULL, NULL, NULL
      UNION ALL SELECT 12, 'RANDOM',   'Trial is Randomized',                     'N',                  NULL, NULL, NULL, NULL
      UNION ALL SELECT 13, 'TBLIND',   'Trial Blinding Schema',                   'OPEN LABEL',         NULL, NULL, NULL, NULL
      UNION ALL SELECT 14, 'ADAPT',    'Adaptive Design',                         'N',                  NULL, NULL, NULL, NULL
      UNION ALL SELECT 15, 'HLTSUBJI', 'Healthy Subject Indicator',               'N',                  NULL, NULL, NULL, NULL
      UNION ALL SELECT 16, 'ADDON',    'Added on to Existing Treatments',         'N',                  NULL, NULL, NULL, NULL
      UNION ALL SELECT 17, 'NARMS',    'Planned Number of Arms',                  '1',                  NULL, NULL, NULL, NULL
      UNION ALL SELECT 18, 'NCOHORT',  'Number of Groups/Cohorts',                '1',                  NULL, NULL, NULL, NULL
      UNION ALL SELECT 19, 'PLANSUB',  'Planned Number of Subjects',              (SELECT COUNT(DISTINCT person_id)::text FROM omop_combined.person), NULL, NULL, NULL, NULL
      UNION ALL SELECT 20, 'ACTSUB',   'Actual Number of Subjects',               (SELECT COUNT(DISTINCT person_id)::text FROM omop_combined.person), NULL, NULL, NULL, NULL
      UNION ALL SELECT 21, 'SEXPOP',   'Sex of Participants',                     'BOTH',               NULL, NULL, NULL, NULL
      UNION ALL SELECT 22, 'AGEMIN',   'Planned Minimum Age of Subjects',         'P18Y',               NULL, NULL, NULL, NULL
      UNION ALL SELECT 23, 'AGEMAX',   'Planned Maximum Age of Subjects',         'P99Y',               NULL, NULL, NULL, NULL
      UNION ALL SELECT 24, 'SSTDTC',   'Study Start Date',                        (SELECT to_char(MIN(condition_start_date), 'YYYY-MM-DD') FROM omop_combined.condition_occurrence), NULL, NULL, NULL, NULL
      UNION ALL SELECT 25, 'SENDTC',   'Study End Date',                          (SELECT to_char(MAX(condition_start_date), 'YYYY-MM-DD') FROM omop_combined.condition_occurrence), NULL, NULL, NULL, NULL
      UNION ALL SELECT 26, 'DCUTDTC',  'Data Cutoff Date',                        to_char(CURRENT_DATE, 'YYYY-MM-DD'), NULL, NULL, NULL, NULL
      UNION ALL SELECT 27, 'DCUTDESC', 'Data Cutoff Description',                 'FINAL',              NULL, NULL, NULL, NULL
      UNION ALL SELECT 28, 'LENGTH',   'Trial Length',                            (SELECT 'P' || DATE_PART('year', age(MAX(condition_start_date), MIN(condition_start_date)))::int::text || 'Y' FROM omop_combined.condition_occurrence), NULL, NULL, NULL, NULL
      UNION ALL SELECT 29, 'FCNTRY',   'Planned Country of Investigational Sites', 'USA',               NULL, 'USA', 'ISO 3166', NULL
      UNION ALL SELECT 30, 'OBJPRIM',  'Trial Primary Objective',                 'Characterize the clinical phenotype of biobank participants', NULL, NULL, NULL, NULL
      UNION ALL SELECT 31, 'OBJSEC',   'Trial Secondary Objective',               NULL,                 'NA', NULL, NULL, NULL
      UNION ALL SELECT 32, 'OUTMSPRI', 'Primary Outcome Measure',                 'Clinical outcomes derived from electronic health records', NULL, NULL, NULL, NULL
      UNION ALL SELECT 33, 'STOPRULE', 'Study Stop Rules',                        'Not applicable for observational study', NULL, NULL, NULL, NULL
      UNION ALL SELECT 34, 'ONGOSIND', 'Ongoing Study Indicator',                 'Y',                  NULL, NULL, NULL, NULL
      UNION ALL SELECT 35, 'EXTTIND',  'Extension Trial Indicator',               'N',                  NULL, NULL, NULL, NULL
      UNION ALL SELECT 36, 'PDSTIND',  'Pediatric Study Indicator',               'N',                  NULL, NULL, NULL, NULL
      UNION ALL SELECT 37, 'PDPSTIND', 'Pediatric Postmarket Study Indicator',    'N',                  NULL, NULL, NULL, NULL
      UNION ALL SELECT 38, 'PIPIND',   'Pediatric Investigation Plan Indicator',  'N',                  NULL, NULL, NULL, NULL
      UNION ALL SELECT 39, 'RDIND',    'Rare Disease Indicator',                  'N',                  NULL, NULL, NULL, NULL
      UNION ALL SELECT 40, 'TDIGRP',   'Diagnosis Group',                         'GENERAL',            NULL, NULL, NULL, NULL
    description: 'CTE for Trial Summary parameters'
  -
    name: measurements_cte
    sql: |
      SELECT
        m.person_id,
        m.measurement_date,
        m.measurement_source_value,
        c.concept_name as measurement_concept_name,
        m.value_as_number,
        m.value_source_value,
        m.unit_source_value,
        m.range_low,
        m.range_high
      FROM omop_combined.measurement m
      JOIN omop_combined.concept c ON m.measurement_concept_id = c.concept_id
      WHERE m.value_as_number IS NOT NULL AND m.measurement_source_value IS NOT NULL and m.measurement_concept_id > 0
    description: 'CTE for laboratory measurements, limited to 5M. Lab test names mapped via mimic-lab-mapping.json during CSV-to-XPT.'
  -
    name: observations_cte
    sql: |
      SELECT DISTINCT ON (o.person_id, o.observation_concept_id, o.observation_date)
        o.person_id,
        o.observation_date,
        o.observation_source_value,
        c.concept_name as observation_concept_name,
        o.value_as_string
      FROM omop_combined.observation o
      JOIN omop_combined.concept c ON o.observation_concept_id = c.concept_id
      WHERE o.observation_concept_id > 0
      ORDER BY o.person_id, o.observation_concept_id, o.observation_date
    description: 'CTE for subject characteristics from omop_combined.observation'
  -
    name: vitalsigns_cte
    sql: |
      SELECT
        m.person_id,
        m.measurement_date,
        m.measurement_datetime,
        c.concept_name as vs_test_name,
        m.value_as_number,
        m.value_source_value,
        m.unit_source_value
      FROM omop_combined.measurement m
      JOIN omop_combined.concept c ON m.measurement_concept_id = c.concept_id
      WHERE m.measurement_concept_id IN (4099154, 4177340)
        AND m.value_as_number IS NOT NULL
    description: 'CTE for vital signs from measurement (Weight, Height only — other VS concept_ids map to culture data in this MIMIC dataset)'
  -
    name: death_cte
    sql: |
      SELECT
        d.person_id,
        d.death_date
      FROM omop_combined.death d
    description: 'CTE for death dates'
  -
    name: procedures_cte
    sql: |
      SELECT DISTINCT ON (po.person_id, c.concept_code, po.procedure_date)
        po.person_id,
        po.procedure_date,
        po.procedure_end_date,
        c.concept_name,
        c.concept_code,
        c.concept_id,
        c.domain_id
      FROM omop_combined.procedure_occurrence po JOIN omop_combined.concept c ON po.procedure_concept_id = c.concept_id
      WHERE c.concept_id > 0
      ORDER BY po.person_id, c.concept_code, po.procedure_date, po.procedure_end_date NULLS LAST
    description: 'CTE for procedures from omop_combined.procedure_occurrence'
  -
    name: specimen_cte
    sql: |
      SELECT
        s.person_id,
        s.specimen_date,
        s.specimen_source_value,
        c.concept_name,
        c.concept_code
      FROM omop_combined.specimen s JOIN omop_combined.concept c ON s.specimen_concept_id = c.concept_id
      WHERE c.concept_id > 0
    description: 'CTE for biospecimens from omop_combined.specimen'
joins:
  -
    alias: conditions_join
    table1: ''
    table2: conditions_cte
    'on': '$table1.person_id = $table2.person_id'
    comment: ''
  -
    alias: ts_join
    table1: ''
    table2: ts_cte
    'on': 'omop_combined.person.person_id = (SELECT MIN(person_id) FROM omop_combined.person)'
    comment: 'Joins ts_cte to a single person row to produce study-level TS records'
  -
    alias: measurements_join
    table1: ''
    table2: measurements_cte
    'on': '$table1.person_id = $table2.person_id'
    comment: 'Joins measurements to person'
  -
    alias: observations_join
    table1: ''
    table2: observations_cte
    'on': '$table1.person_id = $table2.person_id'
    comment: 'Joins observations to person'
  -
    alias: procedures_join
    table1: ''
    table2: procedures_cte
    'on': '$table1.person_id = $table2.person_id'
    comment: 'Joins procedures to person'
  -
    alias: vitalsigns_join
    table1: ''
    table2: vitalsigns_cte
    'on': '$table1.person_id = $table2.person_id'
    comment: 'Joins vital signs to person'
  -
    alias: death_join
    table1: ''
    table2: death_cte
    'on': '$table1.person_id = $table2.person_id'
    comment: 'Joins death to person'
  -
    alias: specimen_join
    table1: ''
    table2: specimen_cte
    'on': '$table1.person_id = $table2.person_id'
    comment: 'Joins specimen to person'
